name: CI
on: # QUANDO roda
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs: # O QUE roda
  backend: # nome do job, você escolhe
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Senha@Forte123
        ports:
          - 1434:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Senha@Forte123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cria o banco
        run: docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Senha@Forte123 -C -Q "CREATE DATABASE meubanco"

      - name: Compila e testa
        run: mvn --batch-mode verify
        env:
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: Senha@Forte123
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-projeto
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instala dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

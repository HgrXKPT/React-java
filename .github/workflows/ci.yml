name: CI
on: # QUANDO roda
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs: # O QUE roda
  backend: # nome do job, você escolhe
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: meubanco
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Compila e testa
        run: mvn --batch-mode verify
        env:
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-projeto
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instala dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
